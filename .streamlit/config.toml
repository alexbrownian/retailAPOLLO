# Streamlit theme for retailAPOLLO.
#
# WHY THIS FILE EXISTS
# --------------------
# Injected CSS can restyle anything Streamlit renders as ordinary markup, but
# some widget chrome - the checkbox tick, the slider track and handle, the
# radio dot, focus rings - is painted from the THEME, not from a class we can
# reach.  With no theme set, Streamlit paints all of that in its default
# signal red (#FF4B4B), which is the single most off-brief colour that can
# appear on the page: the design language is "never vibrant", and red already
# carries a specific meaning in this product (CUT EXPOSURE).
#
# So the palette is declared here, at the supported interface, and the CSS in
# dashboard.py handles only what the theme cannot express.  Setting it in one
# place also means the widget chrome cannot drift away from the chart colours.
#
# The values are the same tokens defined at the top of dashboard.py.  If one
# changes there, change it here too - they are the same design decision
# recorded twice because Streamlit needs it in TOML before Python runs.

[theme]
base = "light"
primaryColor = "#0A1E2E"             # NAVY  - selection, focus, slider fill
backgroundColor = "#FFFFFF"          # WHITE - the page
secondaryBackgroundColor = "#F6F7F8"  # PANEL - sidebar and recessed blocks
textColor = "#111111"                # INK
font = "sans serif"

[server]
# WHY THE WATCHER IS ON, AND WHY IT IS FENCED
#
# Streamlit caches the compiled script and clears that cache in exactly one
# place: the callback the FILE WATCHER fires. With the watcher off, nothing
# ever clears it - a running server keeps executing the bytecode it compiled
# at start-up, so an edited dashboard.py needs a restart, and a hosted copy
# needs its Reboot button after every push even though the new file is
# already in the container. The watcher is therefore what makes "push and
# it appears" work at all.
#
# Left to itself the watcher watches every file under the working directory,
# including the parquet stores the pipeline rewrites IN PLACE while the
# dashboard reads them - a reload mid-read is a source of spurious errors,
# and that is the reason the watcher was ever switched off. The blacklist
# fences the data instead of disabling the mechanism: code is watched, data
# is not. Paths are relative to the folder the server is started in, which
# is the project root.
fileWatcherType = "auto"
folderWatchBlacklist = ["Data", "Reports", "_to_delete", ".venv", ".git",
                        "Reference Materials", "Presentations"]

[browser]
gatherUsageStats = false
